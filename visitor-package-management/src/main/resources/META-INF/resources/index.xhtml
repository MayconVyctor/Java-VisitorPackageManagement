<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Dashboard - CondoManager</title>
</h:head>

<h:body style="background-color: #f4f4f9; padding: 20px; font-family: Arial, sans-serif;">

    <h:form>
        <p:menubar style="margin-bottom: 20px;">
            <p:menuitem value="Início" icon="pi pi-home" url="/index.xhtml" />
            <p:menuitem value="Moradores" icon="pi pi-users" url="/moradores.xhtml" />
            <p:menuitem value="Encomendas" icon="pi pi-box" url="/encomendas.xhtml" />
            <!-- Link para a tela de visitantes adicionado aqui -->
            <p:menuitem value="Visitantes" icon="pi pi-id-card" url="/visitantes.xhtml" />
        </p:menubar>
    </h:form>

    <h2>Visão Geral do Condomínio</h2>

    <!-- h:panelGrid organiza os cartões lado a lado -->
    <h:panelGrid columns="3" style="width: 100%; text-align: center; margin-top: 20px;" cellpadding="10">

        <p:card style="background-color: #007bff; color: white;">
            <f:facet name="title">Moradores Registrados</f:facet>
            <h1 style="margin: 0; font-size: 3rem;">#{dashboardBean.totalMoradores}</h1>
        </p:card>

        <p:card style="background-color: #28a745; color: white;">
            <f:facet name="title">Pacotes Processados</f:facet>
            <h1 style="margin: 0; font-size: 3rem;">#{dashboardBean.totalEncomendas}</h1>
        </p:card>

        <p:card style="background-color: #dc3545; color: white;">
            <f:facet name="title">Visitantes no Local</f:facet>
            <h1 style="margin: 0; font-size: 3rem;">#{dashboardBean.visitantesNoLocal}</h1>
        </p:card>

    </h:panelGrid>

</h:body>
</html>
