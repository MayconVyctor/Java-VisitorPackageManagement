<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Gestão de Moradores - VisitorPackageManager</title>
</h:head>

<h:body style="background-color: #f4f4f9; padding: 20px; font-family: Arial, sans-serif;">
    <p:growl id="mensagens" showDetail="true" />

    <h:form id="formPrincipal">
        <p:panel header="Lista de Moradores">
            <p:commandButton value="Novo Morador" actionListener="#{moradorBean.novo}"
                             update=":formDialog" oncomplete="PF('dialogoMorador').show()"
                             style="margin-bottom: 20px; background-color: #28a745; color: white;" />
            <p:dataTable id="tabela" value="#{moradorBean.moradores}" var="morador" emptyMessage="Nenhum morador encontrado">

                <p:column headerText="ID">
                    <h:outputText value="#{morador.id}" />
                </p:column>

                <p:column headerText="Nome Completo">
                    <h:outputText value="#{morador.nomeCompleto}" />
                </p:column>

                <p:column headerText="CPF">
                    <h:outputText value="#{morador.cpf}" />
                </p:column>

                <p:column headerText="Apartamento">
                    <h:outputText value="#{morador.apartamento}" />
                </p:column>

                <p:column headerText="Ações">
                    <p:commandButton value="Excluir" actionListener="#{moradorBean.excluir(morador)}"
                                     update=":formPrincipal:tabela :mensagens"
                                     style="background-color: #dc3545; color: white; border: none;"/>
                </p:column>

            </p:dataTable>
        </p:panel>
    </h:form>

    <p:dialog header="Cadastro de Morador" widgetVar="dialogoMorador" modal="true" resizable="false">
        <h:form id="formDialog">
            <h:panelGrid columns="2" cellpadding="5">
                <p:outputLabel for="nome" value="Nome Completo:" />
                <p:inputText id="nome" value="#{moradorBean.morador.nomeCompleto}" required="true" requiredMessage="O nome é obrigatório"/>

                <p:outputLabel for="cpf" value="CPF:" />
                <p:inputText id="cpf" value="#{moradorBean.morador.cpf}" required="true" requiredMessage="O CPF é obrigatório"/>

                <p:outputLabel for="apto" value="Apartamento:" />
                <p:inputText id="apto" value="#{moradorBean.morador.apartamento}" required="true" requiredMessage="O apartamento é obrigatório"/>

                <p:outputLabel for="telefone" value="Telefone:" />
                <p:inputText id="telefone" value="#{moradorBean.morador.telefone}" required="true" requiredMessage="O telefone é obrigatório"/>

            </h:panelGrid>

            <p:commandButton value="Salvar" actionListener="#{moradorBean.salvar}"
                             update=":formPrincipal:tabela :mensagens"
                             oncomplete="if(!args.validationFailed) PF('dialogoMorador').hide()" />
        </h:form>
    </p:dialog>

</h:body>
</html>
